name: iOS App Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DM_GAME: "01006BB00C6F0000"
  GAME: "01006BB00C6F0000"

jobs:
  build-ios:
    name: Build iOS Test App
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Build iOS test app
        run: |
          set -o pipefail
          mkdir -p logs
          python3 dm/ios/tools/build_smoke.py \
            --output "$RUNNER_TEMP/ios-smoke" \
            2>&1 | tee logs/ios-build.log

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ios-test
          path: |
            logs/
            ${{ runner.temp }}/ios-smoke/
          retention-days: 7
